* { box-sizing: border-box; }
:root {
  --ink: #1B2A4A; --ink2: #4A5570; --ink3: #8B8F95; --line: #D3D2C9;
  --paper: #F4F3EE; --card: #FFFFFF;
  --ok: #1E7B4F; --ok-bg: #E8F4EC; --ko: #B4233C; --ko-bg: #FBECEE;
  --shadow: 0 1px 2px rgba(27,42,74,.06), 0 6px 18px rgba(27,42,74,.07);
  --shadow-lg: 0 2px 4px rgba(27,42,74,.06), 0 16px 40px rgba(27,42,74,.14);
  --ui: "Archivo", system-ui, sans-serif;
  --accent: #007C74; --bg: #EAF5F3;
}
html { scroll-behavior: smooth; }
body {
  margin: 0; font-family: "Source Serif 4", Georgia, serif; color: var(--ink);
  /* Fond « cahier » : quadrillage fin sur blanc */
  background-color: #fff;
  background-image: linear-gradient(#ECEBE4 1px, transparent 1px), linear-gradient(90deg, #ECEBE4 1px, transparent 1px);
  background-size: 22px 22px;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 3px; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: rgba(255,255,255,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(27,42,74,.08);
}
.topbar-inner { max-width: 1320px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; gap: 18px; }
.brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
.brand img { height: 44px; width: auto; flex-shrink: 0; }
.brand h1 { font: 700 17px/1.2 var(--ui); margin: 0; letter-spacing: -.1px; }
.brand p { font: 400 11.5px/1.3 var(--ui); color: var(--ink2); margin: 3px 0 0; }
.tabs { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
.tab {
  --c: #1B2A4A;
  display: flex; align-items: center; gap: 7px; border: 1.5px solid transparent;
  background: #ECEBE5; color: var(--ink2); border-radius: 999px; padding: 6px 13px 6px 10px;
  font: 600 12.5px var(--ui); white-space: nowrap; cursor: pointer;
  transition: background .25s, color .25s, border-color .25s, box-shadow .25s;
}
.tab .n { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
.tab.current .n { background: #fff; }
.tab:hover { border-color: var(--c); color: var(--c); background: #fff; }
.tab.current { background: var(--c); color: #fff; box-shadow: 0 4px 14px color-mix(in srgb, var(--c) 40%, transparent); }
.progress { height: 3px; background: linear-gradient(90deg, #007C74, #A00058 30%, #EC6708 55%, #3B5C76 78%, #8A6D1D); }

/* ---------- workspace ---------- */
.workspace {
  max-width: 1320px; margin: 0 auto; padding: 22px 24px 40px;
  display: grid; grid-template-columns: minmax(330px, 410px) minmax(0, 1fr); gap: 22px; align-items: start;
}
.node { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); }
.panel { padding: 20px 22px 22px; border-top: 4px solid var(--accent); position: relative; overflow: hidden; }
.panel .num { position: absolute; right: 10px; top: 6px; font: 700 72px/1 var(--ui); color: var(--accent); opacity: .09; letter-spacing: -3px; pointer-events: none; }
.tag { font: 700 10.5px var(--ui); color: var(--accent); text-transform: uppercase; letter-spacing: .9px; }
.panel h2 { font: 700 21px/1.22 var(--ui); margin: 0; letter-spacing: -.1px; }

.levels { display: flex; gap: 6px; margin: 16px 0 0; }
.lvl {
  flex: 1; border: 1.5px solid var(--line); background: #fff; color: var(--ink2); border-radius: 10px;
  padding: 7px 6px 6px; cursor: pointer; font: 600 12px/1.2 var(--ui); text-align: center;
  transition: background .2s, border-color .2s, color .2s;
}
.lvl .dots { display: block; letter-spacing: 2px; font-size: 9px; color: var(--accent); margin-bottom: 2px; }
.lvl small { display: block; font-weight: 400; font-size: 10.5px; color: var(--ink3); margin-top: 2px; }
.lvl:hover { border-color: var(--accent); }
.lvl.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.lvl.on .dots, .lvl.on small { color: #fff; }

.consigne { margin: 16px 0 0; font-size: 15px; line-height: 1.5; }
.consigne .warn {
  display: block; margin-top: 8px; padding: 8px 11px; border-radius: 8px; font-size: 14px;
  background: var(--bg); border-left: 4px solid var(--accent);
}
.question {
  margin: 16px 0 0; padding: 16px 14px; border-radius: 12px; background: var(--bg);
  border: 1.5px solid color-mix(in srgb, var(--accent) 25%, transparent);
  font-size: 23px; line-height: 1.6; text-align: center; min-height: 72px;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 8px;
}
.question .qhint { flex-basis: 100%; font: 400 12.5px var(--ui); color: var(--ink2); }
.ans {
  width: 86px; padding: 4px 6px; border: 2px dashed var(--accent); border-radius: 8px; background: #fff;
  color: var(--ink); font: 600 21px var(--ui); text-align: center; transition: border-color .2s, background .2s;
}
.ans.vec-in { width: 70px; text-transform: uppercase; letter-spacing: 1px; }
.ans:focus { outline: none; border-style: solid; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.ans.good { border: 2px solid var(--ok); background: var(--ok-bg); }
.ans.bad { border: 2px solid var(--ko); background: var(--ko-bg); }
.ans-wrap { display: inline-flex; flex-direction: column; align-items: center; }
.ans-wrap .arrow-over { width: 64px; height: 9px; color: var(--accent); margin-bottom: 1px; }
.slot {
  display: inline-block; min-width: 70px; padding: 3px 10px; border-radius: 8px; border: 2px dashed var(--accent);
  background: #fff; font: 600 15px/1.4 var(--ui); color: var(--ink3);
}
.slot.filled { border-style: solid; color: var(--accent); }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.btn {
  font: 700 13.5px var(--ui); border-radius: 10px; padding: 10px 12px; cursor: pointer;
  border: 1.5px solid var(--line); background: #fff; color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  transition: transform .15s, box-shadow .15s, background .2s;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.btn:active { transform: translateY(1px); }
.btn.primary { grid-column: 1 / -1; background: var(--accent); border-color: var(--accent); color: #fff; font-size: 15px; padding: 12px; box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn.next { grid-column: 1 / -1; }
.btn.pulse { background: var(--accent); border-color: var(--accent); color: #fff; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 50% { box-shadow: 0 0 0 7px transparent; } }
.btn[disabled] { opacity: .45; pointer-events: none; }

.fb { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: 14.5px; line-height: 1.5; display: none; }
.fb.show { display: block; animation: reveal .4s cubic-bezier(.2,.9,.3,1.15); }
.fb.ok { background: var(--ok-bg); border-left: 4px solid var(--ok); }
.fb.ko { background: var(--ko-bg); border-left: 4px solid var(--ko); }
.fb.hint { background: #FFF8E6; border-left: 4px solid #D9A21B; }
.fb.sol { background: var(--bg); border-left: 4px solid var(--accent); }
.fb b.t { font-family: var(--ui); display: block; margin-bottom: 3px; }
.fb .step { margin: 4px 0 0; }
@keyframes reveal { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
.score { margin-top: 14px; font: 400 12px var(--ui); color: var(--ink3); text-align: center; }
.score b { color: var(--accent); }

.figure-card { padding: 10px; position: sticky; top: 84px; }
.figure-card svg { display: block; width: 100%; height: auto; max-height: calc(100vh - 215px); touch-action: none; user-select: none; -webkit-user-select: none; }
.fig-tip { font: 400 12.5px/1.4 var(--ui); color: var(--ink2); text-align: center; margin: 4px 0 2px; }
.fig-tools { display: flex; gap: 8px; justify-content: center; margin: 2px 0 6px; flex-wrap: wrap; }
.fig-tools:empty { display: none; }
.figure-card:has(.stepbar) svg { max-height: calc(100vh - 300px); }
.en-correction > :not(.stepbar) { display: none; }
.stepbar { width: 100%; background: var(--bg); border: 1.5px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 12px; padding: 10px 14px; }
.stepbar .say { font-size: 16px; line-height: 1.55; text-align: center; min-height: 2.4em; animation: reveal .35s ease; }
.stepbar .say .sub { color: var(--ink2); font-size: .9em; }
.stepbar .nav { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.stepbar .count { font: 600 12px var(--ui); color: var(--ink2); min-width: 72px; text-align: center; }
.stepbar .btn.go { background: var(--accent); border-color: var(--accent); color: #fff; }
.fb .calcs { font-size: 16px; margin: 3px 0 0; line-height: 1.9; }
.fb .calc { display: inline-block; padding: 0 6px; border-radius: 6px; line-height: 1.6; }
.fb .calc.item + .calc.item { margin-left: .8em; }
.fb .calc.new { background: color-mix(in srgb, var(--accent) 13%, #fff); animation: reveal .35s ease; }
.fig-tools .btn { font-size: 12.5px; padding: 7px 12px; }

/* ---------- math notation ---------- */
.vec { display: inline-block; position: relative; padding-top: .38em; line-height: 1; font-style: normal; white-space: nowrap; }
.vec::before { content: ""; position: absolute; left: .06em; right: .1em; top: .14em; border-top: .075em solid currentColor; }
.vec::after {
  content: ""; position: absolute; right: .08em; top: .14em; width: .26em; height: .26em;
  border-top: .075em solid currentColor; border-right: .075em solid currentColor;
  transform: translate(0, -50%) rotate(45deg); transform-origin: center;
}
.vec.zero::before { left: .02em; right: .02em; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .8em; line-height: 1.05; margin: 0 .12em; }
.fr > span:first-child { border-bottom: .07em solid currentColor; padding: 0 .12em; }
.cv { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1.1; padding: 0 .3em; margin: 0 .1em; position: relative; font-size: .92em; }
.cv::before, .cv::after { content: ""; position: absolute; top: 0; bottom: 0; width: .3em; border: .07em solid currentColor; }
.cv::before { left: 0; border-right: none; border-radius: .5em 0 0 .5em; }
.cv::after { right: 0; border-left: none; border-radius: 0 .5em .5em 0; }
.op { margin: 0 .1em; }

/* ---------- SVG figures ---------- */
.fig .gl { stroke: #E3E1D8; stroke-width: 1; }
.fig .gl.major { stroke: #D3D1C6; }
.fig .lat { fill: #C9C6BA; }
.fig .shape { fill: color-mix(in srgb, var(--accent) 6%, transparent); stroke: var(--ink); stroke-width: 1.8; stroke-linejoin: round; }
.fig .diag { stroke: var(--ink); stroke-width: 1.2; opacity: .55; }
.fig .pt circle.d { fill: var(--ink); }
.fig .pt text { font: 700 15px var(--ui); fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
.fig .pt .hit { fill: transparent; cursor: pointer; }
.fig .pt.clickable:hover circle.d { fill: var(--accent); }
.fig .pt.flash circle.d { fill: var(--accent); }
.fig .pt.user circle.d { fill: var(--accent); }
.fig .pt.user text { fill: var(--accent); }
.fig .pt.sol circle.d { fill: var(--ok); }
.fig .pt.extra circle.d { fill: var(--accent); }
.fig .pt.extra text { fill: var(--accent); }
.fig .pt.sol text { fill: var(--ok); }
.fig .arr line { stroke: var(--c, var(--ink)); stroke-linecap: round; }
.fig .arr path { fill: var(--c, var(--ink)); }
.fig .arr.ghost { opacity: .4; }
.fig .arr.ghost line { stroke-dasharray: 6 5; }
.fig .arr.user { --c: var(--accent); }
.fig .arr.res { --c: #C2410C; }
.fig .lbl { font: 700 14px var(--ui); paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
.fig .cnt { font: 600 11px var(--ui); fill: var(--ink2); text-anchor: middle; }
.fig .cursor-dot { fill: var(--accent); opacity: .25; pointer-events: none; }
.fig .origin-pulse { fill: none; stroke: var(--accent); stroke-width: 2; animation: opulse 1.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes opulse { from { opacity: .9; transform: scale(.6); } to { opacity: 0; transform: scale(1.8); } }
.fig .fade-in { animation: fadeIn .4s ease both; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.fig text.cap { font: 600 12px var(--ui); fill: var(--ink2); }
.fig .piece { cursor: grab; }
.fig .piece:active { cursor: grabbing; }
.fig .piece .hitline { stroke: transparent; stroke-width: 20; stroke-linecap: round; pointer-events: stroke; }
.fig .piece.sel .arr { filter: drop-shadow(0 0 3px rgba(27,42,74,.55)); }
.fig .piece.sel .arr line { stroke-width: 4.2; }
.fig .piece .lbl { pointer-events: none; }
.fig .arr.reject { --c: var(--ko); animation: fadeOut .9s ease forwards; }
@keyframes fadeOut { 0%, 50% { opacity: 1; } 100% { opacity: 0; } }
.fig .join { fill: none; stroke: var(--ok); stroke-width: 3; animation: opulse .65s ease-out 2; transform-box: fill-box; transform-origin: center; }
.fig-tools .btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.fig-tools .sep { width: 1px; background: var(--line); margin: 2px 4px; }

@media (max-width: 960px) {
  .workspace { grid-template-columns: 1fr; padding: 16px; }
  .figure-card { position: relative; top: 0; }
  .topbar-inner { flex-wrap: wrap; padding: 10px 16px; }
  .tabs { margin-left: 0; justify-content: flex-start; order: 2; width: 100%; }
  .brand { flex: 1 1 0; }
  .topbar-inner > .pe-bouton { margin-left: auto; }   /* bouton plein écran à droite du titre */
}
@media (max-width: 560px) {
  .brand img { height: 34px; }
  .tab { font-size: 11.5px; padding: 5px 10px 5px 8px; }
  .question { font-size: 20px; }
}
/* ---------- tout sur un écran (ordinateur, Chromebook) ----------
   La page ne défile pas : la figure prend la hauteur restante, et seul le panneau
   de gauche défile si un retour (correction pas à pas) est très long. */
@media (min-width: 961px) and (min-height: 560px) {
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .topbar { flex: none; }
  .topbar-inner { padding: 8px 24px; }
  .workspace {
    flex: 1 1 auto; min-height: 0; width: 100%; padding: 14px 24px; gap: 18px;
    grid-template-rows: minmax(0, 1fr); align-items: stretch;
  }
  .panel { min-height: 0; overflow-y: auto; padding: 16px 20px; }
  .levels, .consigne, .question, .actions { margin-top: 12px; }
  .consigne .warn { margin-top: 6px; padding: 6px 10px; }
  .question { padding: 10px 12px; min-height: 60px; }
  .actions .btn { padding: 8px 10px; }
  .actions .btn.primary { padding: 10px; }
  .fb, .score { margin-top: 10px; }
  .figure-card { position: relative; top: 0; min-height: 0; display: flex; flex-direction: column; }
  .fig-tools, .fig-tip { flex: none; }
  #fig { flex: 1 1 0; min-height: 0; }
  .figure-card svg, .figure-card:has(.stepbar) svg { width: 100%; height: 100%; max-height: none; }
  /* zone dédiée aux retours, sous la figure : la figure se réduit, le cadre défile seul s'il est long */
  .figure-card > .fb { flex: none; max-height: 42%; overflow-y: auto; overscroll-behavior: contain; margin: 8px 4px 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---------- écriture mathématique (expr.js) ---------- */
.m { font-family: "Source Serif 4", Georgia, serif; white-space: nowrap; }
.m i { font-style: italic; padding: 0 .02em; }
.m sup { font-size: .68em; line-height: 0; vertical-align: .62em; margin-left: .04em; }
.m .op { margin: 0 .28em; }
.m .op.dot { margin: 0 .12em; }
.m .pa { font-weight: 300; }
/* fraction : la barre est centrée sur l'axe du texte */
.fq { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 .12em; }
.fq > span { display: block; padding: 0 .22em; line-height: 1.3; }
.fq > span:first-child { border-bottom: .065em solid currentColor; padding-bottom: .08em; }
.fq > span:last-child { padding-top: .08em; }
.fq .fq { font-size: .92em; }
.fq.pt { font-size: .72em; margin: 0 .06em; }
/* racine : le signe s'étire sur toute la hauteur du radicande */
.rac { display: inline-block; position: relative; padding-left: .6em; margin: 0 .05em; }
.rac-s { position: absolute; left: 0; top: 0; width: .62em; height: 100%; overflow: visible; }
.rac-s path { fill: none; stroke: currentColor; stroke-width: 1.3; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.rac-i { display: inline-block; border-top: .065em solid currentColor; padding: .12em .12em 0 .06em; line-height: 1.25; }
/* grandes parenthèses (autour d'une fraction) */
.pg { display: inline-block; position: relative; padding: 0 .42em; margin: 0 .04em; }
.pg-g, .pg-d { position: absolute; top: .05em; bottom: .05em; height: calc(100% - .1em); width: .38em; overflow: visible; }
.pg-g { left: 0; } .pg-d { right: 0; }
.pg path { fill: none; stroke: currentColor; stroke-width: 1.1; vector-effect: non-scaling-stroke; }

/* ---------- outil « Dériver » (5e-6e) : fonction en boîtes, cartes des formules ---------- */
.zone-expr { position: relative; height: 100%; min-height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 18px 10px 6px; }
.zone-expr .expr { width: 100%; max-height: 62%; overflow: hidden; text-align: center; font-size: 36px; line-height: 1.5; padding: .5em .2em .2em; }
/* boîtes : morceaux de la fonction */
.expr .bx { display: inline-block; position: relative; border-radius: .22em; padding: .04em .1em; margin: .06em .02em; border: .06em solid transparent; transition: border-color .25s, background .25s; }
.expr .bx.cible { border: .06em dashed var(--ink3); cursor: pointer; }
.expr .bx.cible:hover, .expr .bx.choisissable { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
.expr .bx.indice { border: .06em dashed #D9A21B; background: #FFF8E6; }
.expr .bx.courant { border: .06em solid color-mix(in srgb, var(--ink) 30%, transparent); }
.expr .bx.ouvert { border-color: color-mix(in srgb, var(--ink) 22%, transparent); }
.expr .bx[class*=" r-"] { border: .06em solid var(--c); background: color-mix(in srgb, var(--c) 6%, transparent); }
.expr .bx[data-lab]::before {
  content: attr(data-lab); position: absolute; left: -.2em; top: -.62em; z-index: 1;
  font: 700 .36em/1.45 var(--ui); color: #fff; background: var(--c); border-radius: .5em; padding: 0 .45em; font-style: italic;
}
.expr .bx[data-op]::after {
  content: attr(data-op); position: absolute; right: -.15em; top: -.62em; z-index: 1; white-space: nowrap;
  font: 700 .3em/1.5 var(--ui); color: var(--ink2); background: #fff; border: 1px solid var(--line); border-radius: .5em; padding: 0 .5em;
}
.r-f { --c: #007C74; } .r-g { --c: #A00058; } .r-u { --c: #EC6708; } .r-k { --c: #3B5C76; } .r-terme { --c: #8A6D1D; }
.qui { display: inline-block; font: italic 700 .82em/1.3 var(--ui); color: #fff; background: var(--c, var(--ink2)); border-radius: 6px; padding: 0 .4em; }
/* formules trouvées, sous la fonction */
.formules-vues { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 6px; }
.formules-vues:empty { display: none; }
.fv { margin: 0; padding: 6px 12px; border-radius: 10px; background: var(--bg); border-left: 4px solid var(--accent); font-size: 17px; line-height: 1.6; }
.fv.new { animation: apparait .5s ease both; box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
@keyframes apparait { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.fv b { font: 700 13px var(--ui); margin-right: 6px; }
.fv .ici { font-size: 14px; color: var(--ink2); }
.defis { font: 600 13px var(--ui); color: var(--ink2); }
.defi.fait { color: var(--ok); }
/* zone réponse : cartes des formules et étiquettes */
.question:has(.cartes), .question:has(.puces) { display: block; text-align: left; font-size: 16px; padding: 10px 12px 12px; }
.question .qtitre { margin: 0 0 8px; font: 700 13.5px var(--ui); color: var(--ink2); }
.question .qf { font-size: 26px; }
.cartes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.carte {
  border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 5px 8px 6px; cursor: pointer; text-align: left;
  display: flex; flex-direction: column; align-items: center; gap: 0; min-height: 50px; padding: 4px 3px 5px; transition: border-color .2s, background .2s, box-shadow .2s; color: var(--ink);
}
.carte small { font: 600 9.5px var(--ui); color: var(--ink3); text-transform: uppercase; letter-spacing: .4px; white-space: nowrap; }
.carte .mw { flex: 1; display: flex; align-items: center; }
.carte .m { font-size: 18px; }
.carte:hover { border-color: var(--accent); }
.carte.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, #fff); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.puces { display: flex; gap: 10px; justify-content: center; margin: 4px 0 6px; }
.puce { font: italic 700 22px var(--ui); color: #fff; background: var(--c); border: 3px solid transparent; border-radius: 12px; min-width: 56px; padding: 4px 14px; cursor: pointer; transition: transform .15s, box-shadow .2s, opacity .2s; }
.puce.on { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--c); transform: translateY(-2px); }
.puce.place { opacity: .55; }
.question .qhint { text-align: center; }
/* fenêtre « Exercice du cours » */
#fig { position: relative; }
.figure-card .zone-expr ~ svg { display: none; }
/* le style partagé de la 4e étire les SVG de la figure : pas les signes racine ni les parenthèses */
.figure-card svg.rac-s, .figure-card svg.pg-g, .figure-card svg.pg-d { width: .62em; height: 100%; max-height: none; display: block; touch-action: auto; }
.figure-card svg.pg-g, .figure-card svg.pg-d { width: .38em; height: calc(100% - .1em); }
.fv.feuille { border-left-color: var(--line); background: #FAFAF7; }
@media (max-width: 560px) {
  .cartes { grid-template-columns: 1fr 1fr; }
  .zone-expr .expr { font-size: 26px; }
}
/* Explorer : pas de vérification, d'indice ni de correction (comme en 4e) */
.mode-explorer #bCheck, .mode-explorer #bHint, .mode-explorer #bSolve { display: none; }
.mode-explorer #bNext { grid-column: 1 / -1; }
/* étiquettes emboîtées décalées ; boîte en cours d'ouverture ; glisser-déposer */
.expr .bx.lab-d1::before { left: 1.9em; } .expr .bx.lab-d2::before { left: 3.8em; } .expr .bx.lab-d3::before { left: 5.7em; }
.expr .bx.courant { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, transparent); }
.expr .bx.survol { border-color: var(--accent); border-style: solid; background: color-mix(in srgb, var(--accent) 14%, transparent); }
.puce { touch-action: none; }
.puce.fantome { position: fixed; z-index: 100; pointer-events: none; transform: translate(-50%, -60%) scale(1.08); box-shadow: var(--shadow-lg); opacity: .95; }
.zone-expr .formules-vues { flex: 0 1 auto; min-height: 0; overflow-y: auto; scroll-behavior: smooth; }
/* l'étiquette se loge dans une marge en haut de sa boîte : elle ne cache ni un exposant ni le morceau voisin */
.expr .bx[data-lab] { padding-top: .4em; }
.expr .bx[data-lab]::before { top: -.16em; }
.expr .bx[data-lab]::before { font-size: max(.36em, 13px); }
/* Explorer : fonction fixe en haut, lignes ajoutées en dessous, bandeau d'étapes en bas */
.zone-expr.explorer { justify-content: flex-start; gap: 10px; padding-top: 8px; }
.zone-expr.explorer .expr { flex: none; max-height: none; }
.zone-expr.explorer .formules-vues { flex: 1 1 auto; }
.expr .bx.lab-place { padding-top: .4em; }
.expr .bx { transition: border-color .35s ease, background-color .35s ease; }
.ex-nav { flex: none; width: 100%; display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap;
  background: var(--bg); border: 1.5px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 12px; padding: 8px 10px; }
.ex-nav .count { font: 600 12px var(--ui); color: var(--ink2); min-width: 72px; text-align: center; }
.ex-nav .btn { font-size: 12.5px; padding: 7px 12px; }
.ex-nav .btn.go { background: var(--accent); border-color: var(--accent); color: #fff; }
/* termes d'une somme à placer sur une ligne du formulaire */
.expr .bx.faux { --c: var(--ko); border: .06em solid var(--ko); background: var(--ko-bg); }
.fantome { position: fixed; z-index: 100; pointer-events: none; transform: translate(-50%, -60%) scale(1.06); }
.fantome > .m { display: inline-block; background: #fff; border: 2px solid var(--accent); border-radius: 8px; padding: 2px 10px; font-size: 24px; box-shadow: var(--shadow-lg); }
.fantome > .puce { box-shadow: var(--shadow-lg); }
/* ---------- onglet « Remplir la formule » ---------- */
.zone-expr.remplir { justify-content: flex-start; gap: 8px; padding-top: 6px; }
.zone-expr.remplir .expr { flex: none; max-height: none; font-size: 30px; padding-top: .3em; }
.formule-nom { flex: none; font-size: 16px; color: var(--ink2); }
.formule-nom b { font: 700 12px var(--ui); text-transform: uppercase; letter-spacing: .5px; color: var(--accent); margin-right: 6px; }
.formule-nom .ici { font-size: 13px; }
.modele { flex: none; width: 100%; text-align: center; font-size: 30px; line-height: 1.6; padding: 8px 6px; border-radius: 12px; background: var(--bg); overflow: hidden; }
.modele .prime { color: var(--ink2); margin-right: .2em; }
.trou { display: inline-block; min-width: 1.6em; min-height: 1.15em; padding: 0 .12em; margin: .04em .06em; vertical-align: middle; border: .06em dashed var(--accent); border-radius: .2em; background: #fff; cursor: pointer; transition: background .2s, border-color .2s; }
.trou .vide { color: var(--ink3); font: 700 .6em var(--ui); }
.trou.plein { border-style: solid; border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: #fff; }
.trou.attend, .trou.survol { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, #fff); }
.trou.faux { border: .06em solid var(--ko); background: var(--ko-bg); }
.lignes-sol { flex: 1 1 auto; min-height: 0; overflow-y: auto; width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 4px; scroll-behavior: smooth; }
.ls { margin: 0; padding: 4px 12px; font-size: 22px; line-height: 1.7; border-radius: 10px; }
.ls.new { background: color-mix(in srgb, var(--accent) 10%, #fff); animation: apparait .45s ease both; }
.ls .fin { font: 700 12px var(--ui); color: var(--ok); margin-left: 8px; }
.zone-expr.remplir .ex-nav:empty { display: none; }
/* zone réponse : dérivées à choisir, tuiles */
.question:has(.choix-ligne), .question:has(.tuiles) { display: block; text-align: left; font-size: 16px; padding: 10px 12px 12px; }
.choix-ligne { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 5px 6px; border-radius: 10px; margin-bottom: 4px; }
.choix-ligne.faux { background: var(--ko-bg); }
.choix-ligne .eti { font-size: 17px; min-width: 92px; }
.choix-ligne .pour { color: var(--ink2); font-size: .9em; }
.opts { display: flex; gap: 5px; flex-wrap: wrap; }
.opt { border: 1.5px solid var(--line); background: #fff; border-radius: 9px; padding: 3px 9px; cursor: pointer; font-size: 17px; color: var(--ink); min-height: 38px; }
.opt:hover { border-color: var(--accent); }
.opt.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, #fff); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.tuiles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tuile { display: flex; align-items: center; gap: 8px; border: 2px solid var(--c); background: #fff; border-radius: 10px; padding: 4px 8px; cursor: grab; touch-action: none; color: var(--ink); font-size: 18px; min-height: 44px; text-align: left; }
.tuile .nom { flex: none; font: italic 700 15px var(--ui); color: #fff; background: var(--c); border-radius: 7px; padding: 1px 8px; }
.tuile.on { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--c); }
.fantome > .tuile { display: inline-flex; box-shadow: var(--shadow-lg); }


/* ---------- indicateur des quatre étapes ---------- */
.etapes { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; justify-content: center; align-items: center; }
.etapes li { font: 600 11.5px var(--ui); color: var(--ink3); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; background: #fff; white-space: nowrap; }
.etapes li b { margin-right: 4px; }
.etapes li.fait { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }
.etapes li.fait b::before { content: "✓"; }
.etapes li.fait b span { display: none; }
.etapes li.on { background: var(--accent); border-color: var(--accent); color: #fff; }
@media (max-width: 560px) { .etapes li { font-size: 10.5px; padding: 3px 7px; } }

/* Onglet « Exercices du cours » : icône et rangée de numéros */
.tab .ico { display: block; width: 20px; height: 20px; margin: -3px 0; flex-shrink: 0; }
.tab .ico svg { display: block; width: 100%; height: 100%; }
.ex-cours { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; justify-content: center; width: 100%; }
.ex-cours .grp { font: 700 12px var(--ui); color: var(--accent); margin-right: 2px; }
.ex-cours .sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 6px; }
.ex-cours .num { min-width: 27px; height: 27px; padding: 0 4px; border-radius: 7px; border: 1.5px solid var(--line); background: #fff; color: var(--ink2); font: 600 12.5px var(--ui); cursor: pointer; }
.ex-cours .num:hover { border-color: var(--accent); color: var(--accent); }
.ex-cours .num.fait { border-color: var(--ok); color: var(--ok); background: var(--ok-bg); }
.ex-cours .num.on { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 40%, transparent); }
@media (max-width: 560px) { .ex-cours .num { min-width: 24px; height: 24px; font-size: 11.5px; } }

/* Fenêtre de la simplification : par-dessus la zone de la fonction, toute la place pour le calcul */
.simpl { position: absolute; inset: 4px; z-index: 15; background: #fff; border-radius: 14px; border-top: 4px solid var(--accent); box-shadow: 0 10px 30px rgba(27,42,74,.18); display: flex; flex-direction: column; }
.simpl.ouvre { animation: reveal .3s ease; }
/* ligne surlignée : seule une ligne qui vient d'être ajoutée apparaît en douceur */
.simpl-corps .ls.new { animation: none; }
.simpl-corps .ls.arrive { animation: apparait .45s ease both; }
.simpl[hidden] { display: none; }
.simpl-tete { flex: none; display: flex; align-items: center; gap: 12px; padding: 8px 10px 6px 16px; border-bottom: 1px solid var(--line); font-family: var(--ui); }
.simpl-tete b { color: var(--accent); }
.simpl-tete .rappel { flex: 1; min-width: 0; overflow: hidden; font-size: 17px; color: var(--ink2); }
.simpl-x { padding: 4px 10px; }
.simpl-corps { position: relative; flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 6px; scroll-behavior: smooth; }
.simpl-corps .ls { flex: none; overflow: hidden; white-space: nowrap; position: relative; z-index: 1; }
.simpl-corps .ls.depart { padding-top: 34px; font-family: "Source Serif 4", Georgia, serif; }
.simpl-corps .eti { display: block; font: 700 11px var(--ui); text-transform: uppercase; letter-spacing: .5px; color: var(--accent); line-height: 1.3; }
.simpl-nav { flex: none; display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; padding: 8px; border-top: 1px solid var(--line); }
.simpl-nav .count { font: 600 12px var(--ui); color: var(--ink2); min-width: 72px; text-align: center; }
.simpl-nav .btn { font-size: 12.5px; padding: 7px 12px; }
.simpl-nav .btn.go { background: var(--accent); border-color: var(--accent); color: #fff; }
.figure-card svg.arcs { position: absolute; left: 0; top: 0; width: 100%; max-height: none; pointer-events: none; overflow: visible; z-index: 2; touch-action: auto; }
svg.arcs path { fill: none; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: trace-arc .6s ease forwards; }
@keyframes trace-arc { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { svg.arcs path { animation-duration: .01s; } }

/* @PLEIN-ECRAN:CSS début : module partagé, repris par 4eme/src/build.mjs */

<script>
'use strict';
/* =====================================================================
   Outils généraux : hasard, fractions, notation, SVG, animations
   ===================================================================== */
const NS = 'http://www.w3.org/2000/svg';
const MINUS = '−';
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const add = (p, q) => [p[0] + q[0], p[1] + q[1]];
const sub = (p, q) => [p[0] - q[0], p[1] - q[1]];
const scl = (k, p) => [k * p[0], k * p[1]];
const same = (p, q) => Math.abs(p[0] - q[0]) < 1e-9 && Math.abs(p[1] - q[1]) < 1e-9;
const lerp = (p, q, t) => [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t];

/* ---------- fractions {n, d} ---------- */
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
function F(n, d = 1) { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; }
const fmul = (a, b) => F(a.n * b.n, a.d * b.d);
const fdiv = (a, b) => F(a.n * b.d, a.d * b.n);
const feq = (a, b) => a.n === b.n && a.d === b.d;
const fval = a => a.n / a.d;
const fneg = a => F(-a.n, a.d);
const fadd = (a, b) => F(a.n * b.d + b.n * a.d, a.d * b.d);
const fsub = (a, b) => fadd(a, fneg(b));
const fr = x => typeof x === 'number' ? F(x) : x;          // entier ou fraction → fraction

// Lit « -2/3 », « −2/3 », « 0,5 », « 1.5 », « 3 »
function parseNum(str) {
  str = String(str).replace(/\s+/g, '').replace(/[−–]/g, '-').replace(/,/g, '.');
  const m = str.match(/^([+-]?)(\d+(?:\.\d+)?|\.\d+)(?:\/([+-]?)(\d+(?:\.\d+)?))?$/);
  if (!m) return null;
  const dec = s => { const p = s.split('.'); const k = p[1] ? p[1].length : 0; return F(parseInt(p[0] || '0', 10) * 10 ** k + (k ? parseInt(p[1], 10) : 0), 10 ** k); };
  let f = dec(m[2]);
  if (m[4] !== undefined) { const d = dec(m[4]); if (d.n === 0) return null; f = fdiv(f, d); }
  if ((m[1] === '-') !== (m[3] === '-')) f = fneg(f);
  return f;
}

/* ---------- notation HTML ---------- */
const numStr = n => (n < 0 ? MINUS : '') + Math.abs(n);
const signed = n => (n > 0 ? '+' : n < 0 ? MINUS : '') + Math.abs(n);
function fracHTML(f, dec) {
  if (f.d === 1) return numStr(f.n);
  if (dec) { const v = Math.round(f.n / f.d * 1000) / 1000; return (v < 0 ? MINUS : '') + String(Math.abs(v)).replace('.', ','); }
  return (f.n < 0 ? MINUS : '') + `<span class="fr"><span>${Math.abs(f.n)}</span><span>${f.d}</span></span>`;
}

'use strict';

function polyDegres(nMax = 4, termesMax = 3) {
  const n = rnd(2, nMax);
  const autres = shuffle([...Array(n).keys()]).slice(0, rnd(1, termesMax - 1)).sort((a, b) => b - a);
  return polyTxt([[nz(-5, 5), n], ...autres.map(e => [nz(e === 0 ? -9 : -6, e === 0 ? 9 : 6), e])]);
}
// quotient de deux binômes sans simplification possible : ad − bc ≠ 0
function quotientBinomes() {
  let a, b, c, d;
  do { a = nz(-5, 5); b = nz(-7, 7); c = nz(-5, 5); d = nz(-7, 7); } while (a * d === b * c);
  return `(${polyTxt([[a, 1], [b, 0]])})/(${polyTxt([[c, 1], [d, 0]])})`;
}
const xn = () => polyTxt([[1, rnd(2, 4)], [nz(-5, 5), 0]]);        // x^n + b

const GENS = {
  // Onglet 1 : sommes et différences
  somme: {
    1: [() => polyDegres(4, 4)],
    2: [
      () => polyTxt(shuffle([[nz(-5, 5), rnd(2, 4)], [nz(-6, 6), pick([0, 1])], [nz(-4, 4), pick([-1, 0.5])]])),
      () => polyTxt(shuffle([[nz(-5, 5), rnd(2, 3)], [nz(-4, 4), -1], [nz(-4, 4), 0.5], [nz(-9, 9), 0]]).slice(0, 3)),
      () => polyTxt([[nz(-5, 5), rnd(2, 4)], [nz(-4, 4), pick([-1, 0.5])], [nz(-9, 9), 0]])
    ],
    3: [() => sommeDeguisee()]
  },
  // Onglet 2 : produits et quotients (la question n'annonce pas lequel)
  prodquot: {
    1: [
      () => entre(lin()) + entre(lin()),
      () => entre(lin()) + entre(lin()),
      () => entre(xn()) + entre(lin()),
      () => entre(lin2()) + entre(lin())
    ],
    2: [
      () => quotientBinomes(),
      () => quotientBinomes(),
      () => `(${xn()})/(${lin()})`,
      () => `(${lin()})/(${xn()})`
    ],
    3: [
      () => `(${lin2()})(${lin()})`,
      () => `(${polyTxt([[nz(1, 4), 1], [1, 0.5]])})(${lin2()})`,
      () => `(${lin2()})/(${lin()})`,
      () => `(${polyTxt([[nz(1, 3), 2], [nz(1, 4), 0.5], [nz(-5, 5), 0]])})/(${lin()})`,
      () => `${nz(2, 5)}sqrt(x)(${lin()})`,
      () => `sqrt(x)(${lin2()})`,
      () => `(${lin()})/sqrt(x)`,
      () => `(${lin2()})/(${lin2()})`
    ]
  },
  // Onglet 3 : composées
  composee: {
    1: [() => `(${lin()})^${rnd(2, 4)}`],
    2: [() => `sqrt(${lin()})`, () => `sqrt(${lin()})`, () => `${nz(2, 4)}sqrt(${lin()})`],
    3: [
      () => `${nz(1, 7)}/(${lin()})`,
      () => `1/(${lin()})`,
      () => `${nz(1, 6)}/(${lin()})^${rnd(2, 3)}`,
      () => `(${lin2()})^${rnd(2, 3)}`,
      () => `sqrt(${lin2()})`,
      () => `${nz(1, 5)}/(${lin2()})`
    ]
  },
  // Onglet 4 : défi (une composée dans un produit, un quotient avec racine…)
  defi: {
    1: [
      () => `sqrt(x)/(${lin()})`,
      () => `(${lin()})/sqrt(x)`,
      () => `x^${rnd(2, 4)}(${lin()})^${rnd(2, 3)}`,
      () => `(${lin()})^${rnd(2, 3)}(${lin()})^2`,
      () => `x sqrt(${lin2()})`,
      () => `(${lin()})/sqrt(${lin2()})`,
      () => `x+(${lin2()})/(${lin2()})`,
      () => `((${lin()})/(${lin()}))^2`,
      () => `(1+${nz(1, 3)}/x)^${rnd(2, 3)}`,
      () => `(${lin()})^2/(${lin()})`,
      () => `(${lin()})sqrt(x)`,
      () => `(${lin()})^${rnd(2, 3)}sqrt(x)`
    ]
  }
};
// fonction au hasard (texte), sans cas dégénéré (dérivée constante, racine d'un nombre négatif partout…)
function genFonction(genre, niv) {
  for (let essai = 0; essai < 300; essai++) {
    const s = pick(GENS[genre][niv])();
    let a;
    try { a = E.parse(s); } catch (e) { continue; }
    if (E.isConst(a)) continue;
    const d = E.D(a);
    if (E.isConst(d)) continue;
    const vals = [0.3, 0.8, 1.7, 2.6, 3.9].map(x => E.ev(a, x)).filter(Number.isFinite);
    if (vals.length < 2) continue;
    return s;
  }
  return 'x^2+1';
}

// Étape 1 du déroulé : reconnaître la formule, puis nommer les morceaux f, g, u. cfg.sansOp : formules annoncées par l'onglet (le premier choix est sauté) ;
// cfg.ops : formules proposées au premier choix.
function creerFormule(ctx, cfg = {}) {
    const lv = 3;
    ctx.svg.style.display = 'none';
    const zone = document.createElement('div');
    zone.className = 'zone-expr';
    zone.innerHTML = '<div class="expr" aria-live="polite"></div><div class="formules-vues"></div><div class="defis"></div>';
    ctx.svg.parentNode.appendChild(zone);
    const elExpr = zone.querySelector('.expr'), elVues = zone.querySelector('.formules-vues'), elDefis = zone.querySelector('.defis');

    let q = null;           // { src, comp, T, banque }
    let st = null;          // état : phase courante, choix, étiquettes, nœuds ouverts

    /* ---------- question ---------- */
    function charger(src, comp) {
      cancelAnim(); clearFeedback(); App.solved = App.revealed = false; App.sol = null;
      ctx.tools.querySelector('.stepbar')?.remove(); ctx.tools.classList.remove('en-correction');
      const a = E.parse(src);
      q = { src, comp, T: arbre(a, comp) };
      // identifiants des nœuds de l'arbre
      let n = 0; const tous = [];
      (function go(T, parent, role) { T.id = 'b' + (n++); T.parent = parent; T.role = role; tous.push(T); T.kids.forEach((k, i) => go(k, T, T.d.pieces[i].role)); })(q.T, null, null);
      q.tous = tous;
      q.phases = phasesDe(q.T);
      reset();
      setState();
    }

    function phasesDe(T) {
      const ph = [];
      q.donnees = [];
      (function visite(T) {
        // formule annoncée par l'onglet : la question ne demande pas de la reconnaître
        // (aussi sous un nombre en facteur : 2√(4x − 1), la formule de √u reste donnée)
        const haut = !T.parent || (T.parent.d.op === 'kf' && !T.parent.parent);
        if (haut && cfg.sansOp && cfg.sansOp.includes(T.d.op)) q.donnees.push(T); else ph.push({ type: 'op', T });
        if (lv >= 2 && OPS_MORCEAUX.includes(T.d.op)) ph.push({ type: 'pieces', T });
        if (lv >= 3) T.kids.forEach(k => { if (aDecouper(k)) visite(k); });
      })(T);
      return ph;
    }
    function reset() {
      st = { i: 0, choix: null, lab: {}, sel: null, ouverts: new Set(), opDe: {}, tagRole: {} };
      q.donnees.forEach(T => valideOp({ T }, T.d.op));
      if (!q.phases.length) st.fini = true;
      dessiner();
    }
    const phase = () => q.phases[st.i];

    /* ---------- dessin ---------- */
    function dessiner(opt = {}) {

      const ph = phase();
      const marks = new Map();
      for (const T of q.tous) {
        const m = { id: T.id, cls: '' };
        const parentOuvert = T.parent && st.ouverts.has(T.parent.id);
        const cible = ph && ph.type === 'pieces' && T.parent === ph.T;
        if (cible) m.cls += ' cible';
        else if (opt.indice && ph && T.parent === ph.T) m.cls += ' indice';
        if (st.ouverts.has(T.id)) m.cls += ' ouvert';
        const role = etiquette(T);
        if (role) {
          m.lab = role; m.cls += ' r-' + role;
          // étiquettes emboîtées : décalées vers la droite pour ne pas se superposer
          let n = 0; for (let p = T.parent; p; p = p.parent) if (etiquette(p)) n++;
          if (n) m.cls += ' lab-d' + Math.min(n, 3);
        }
        if (ph && ph.T === T && ph.type === 'op') m.cls += ' courant';
        if (st.sel && ph && ph.type === 'pieces' && T.parent === ph.T) m.cls += ' choisissable';
        if (m.cls || m.op || m.lab) marks.set(T.node, m);
      }
      elExpr.innerHTML = '<span class="m"><i>f</i>(<i>x</i>) = </span>' + E.mathMarks(q.T.node, marks);
      requestAnimationFrame(() => ajuste(elExpr));
      // formules déjà trouvées, dans l'ordre
      elVues.innerHTML = q.tous.filter(T => st.ouverts.has(T.id)).map(T => ligneFormule(T)).join('');
      elDefis.innerHTML = '';
      dessinerReponse();

    }
    // étiquette affichée sur ce nœud (f, g, u) ou null
    function etiquette(T) {
      const parentOuvert = T.parent && st.ouverts.has(T.parent.id);
      return st.lab[T.id] || (parentOuvert && st.tagRole[T.id]) || null;
    }
    function ligneFormule(T) {
      const op = st.opDe[T.id] || T.d.op, F0 = FORMULES[op];
      const qui = T.parent ? `<span class="qui r-${T.role}">${T.role === 'terme' ? 'terme' : T.role}</span> ${E.math(T.node)} : ` : '';
      const n = (op === 'puissance') ? ` <span class="ici">(ici <i>n</i> = ${numStr(T.d.n)})</span>` : '';
      const d = F0.d ? `(${F0.f})′ = ${F0.d}` : F0.f;
      return `<p class="fv">${qui}<b>${F0.nom}</b> <span class="m">${d}</span>${n}</p>`;
    }


    /* ---------- zone réponse (panneau de gauche) ---------- */
    function dessinerReponse() {

      if (st.fini) { ctx.q.innerHTML = `<p class="qtitre">Formules trouvées ✓</p><p class="qhint">Elles sont écrites sous la fonction. Passe à une autre question !</p>`; return; }
      const ph = phase();
      if (ph.type === 'op') {
        const quoi = ph.T.parent ? `Pour dériver <span class="qui r-${ph.T.role}">${ph.T.role === 'terme' ? 'ce terme' : ph.T.role}</span>, quelle formule ?` : 'Quelle formule en premier ?';
        const tout = ORDRE_FORMULES.filter(o => q.comp || !FORMULES[o].comp);
        const ops = cfg.ops && !ph.T.parent && cfg.ops.includes(ph.T.d.op) ? tout.filter(o => cfg.ops.includes(o)) : tout;
        ctx.q.innerHTML = `<p class="qtitre">${quoi}</p><div class="cartes">` + ops.map(o =>
          `<button class="carte${st.choix === o ? ' on' : ''}" data-op="${o}"><small>${FORMULES[o].nom}</small><span class="mw"><span class="m">${FORMULES[o].f}</span></span></button>`).join('') + '</div>';
        ctx.q.querySelectorAll('.carte').forEach(b => b.onclick = () => { st.choix = b.dataset.op; ctx.changed(); dessinerReponse(); });
      } else {
        const roles = rolesDe(ph);
        ctx.q.innerHTML = `<p class="qtitre">Place ${roles.length > 1 ? 'les étiquettes' : 'l’étiquette'} sur ${roles.length > 1 ? 'les morceaux' : 'le morceau'} :</p><div class="puces">`
          + roles.map(r => `<button class="puce r-${r}${st.sel === r ? ' on' : ''}${Object.values(st.lab).includes(r) && ph.T.kids.some(k => st.lab[k.id] === r) ? ' place' : ''}" data-r="${r}">${r}</button>`).join('')
          + '</div><p class="qhint">Fais glisser chaque étiquette sur son morceau (ou clique sur l’étiquette, puis sur le morceau).</p>';
        ctx.q.querySelectorAll('.puce').forEach(b => {
          const r = b.dataset.r;
          glisserVers(b, `<span class="puce r-${r}">${r}</span>`, '.expr .bx.cible',
            c => poser(q.tous.find(t => t.id === c.dataset.id), r), () => { st.sel = st.sel === r ? null : r; dessiner(); });
        });
      }
    }
    // étiquettes à placer : f et g (produit, quotient), u (composées) ; g pour 1/u traité en quotient
    const rolesDe = ph => ph.T.d.pieces.map(p => p.role);

    // clic sur un morceau : on y pose l'étiquette sélectionnée (ou la suivante)
    elExpr.addEventListener('click', e => {
      const bx = e.target.closest('.bx.cible');
      if (!bx || App.sol) return;
      poser(q.tous.find(t => t.id === bx.dataset.id));
    });
    function poser(T, rChoisi) {
      const ph = phase();
      if (!ph || ph.type !== 'pieces' || T.parent !== ph.T) return;
      const roles = rolesDe(ph);
      let r = rChoisi || st.sel || roles.find(x => !ph.T.kids.some(k => st.lab[k.id] === x));
      if (!r) r = roles[(roles.indexOf(st.lab[T.id]) + 1) % roles.length];
      // une étiquette ne se pose qu'une fois : on la retire de l'autre morceau
      ph.T.kids.forEach(k => { if (st.lab[k.id] === r) delete st.lab[k.id]; });
      st.lab[T.id] = r;
      st.sel = null;
      ctx.changed();
      dessiner();
    }

    /* ---------- vérification ---------- */
    function valideOp(ph, op) {
      st.ouverts.add(ph.T.id); st.opDe[ph.T.id] = op;
      // au niveau 1, les morceaux apparaissent avec leur nom
      if (lv === 1 || !OPS_MORCEAUX.includes(ph.T.d.op)) ph.T.kids.forEach((k, i) => { st.tagRole[k.id] = ph.T.d.pieces[i].role === 'terme' ? null : rolesDe({ T: ph.T })[i]; });
    }
    function check() {
      if (st.fini) return { ok: true, msg: 'Toutes les formules sont trouvées.' };
      const ph = phase();
      if (ph.type === 'op') {
        if (!st.choix) return { ok: false, empty: true, msg: 'Clique sur une des formules.' };
        const ok = formulesOk(ph.T.d);
        if (!ok.includes(st.choix)) return { ok: false, msg: pisteOp(ph.T, st.choix) };
        // autre formule juste (k/u par le quotient…) : on garde celle de la composée, plus rapide
        if (st.choix !== ph.T.d.op) {
          valideOp(ph, ph.T.d.op);
          return suite(`Ça marche aussi avec ${article(st.choix)}, mais ici la formule de la <b>composée</b> ${FORMULES[ph.T.d.op].f} va plus vite : on la prend.`);
        }
        valideOp(ph, st.choix);
        return suite(`C’est bien ${article(st.choix)}.`);
      }
      const roles = rolesDe(ph), kids = ph.T.kids;
      if (roles.some(r => !kids.some(k => st.lab[k.id] === r))) return { ok: false, empty: true, msg: 'Place chaque étiquette sur un morceau.' };
      const juste = kids.every((k, i) => {
        if (ph.T.d.op === 'produit') return true;                       // f·g = g·f : les deux ordres conviennent
        return st.lab[k.id] === roles[i];
      });
      if (!juste) return { ok: false, msg: pistePieces(ph) };
      kids.forEach(k => { st.tagRole[k.id] = st.lab[k.id]; });
      return suite('Les morceaux sont bien nommés.');
    }
    const article = op => ({ somme: 'une somme', kf: 'un nombre × une fonction', produit: 'un produit', quotient: 'un quotient', puissance: 'une composée uⁿ', inverse: 'une composée 1/u', racine: 'une composée √u', base: 'une formule de base' }[op]);
    function suite(msg) {
      st.choix = null; st.sel = null;
      if (st.i < q.phases.length - 1) {
        st.i++;
        dessiner();
        const ph = phase();
        feedback('ok', 'Oui ! ✓', msg + ' ' + (ph.type === 'pieces' ? 'Place maintenant les étiquettes.' : `Et pour ${ph.T.role === 'terme' ? 'ce terme' : 'le morceau ' + ph.T.role} ?`));
        return null;
      }
      st.fini = true;
      dessiner();
      return { ok: true, msg: msg + (lv === 3 ? ' Tu as trouvé toutes les formules !' : '') };
    }
    function pisteOp(T, choix) {
      const op = T.d.op;
      if (choix === 'produit' && op === 'kf') return 'C’est bien une multiplication, mais un des facteurs est un <b>nombre</b> : la formule <i>k</i>·<i>f</i> est plus simple.';
      if (choix === 'somme' && op !== 'somme') return 'Il y a des + ou des −, mais ils sont <b>à l’intérieur</b> d’un morceau. Quelle opération relie les grands morceaux ?';
      if (choix === 'base') return 'Cette fonction n’est pas une ligne du formulaire telle quelle : il faut d’abord une formule qui la découpe.';
      if (FORMULES[choix].comp && !FORMULES[op]?.comp) return 'Ce n’est pas une composée : rien n’est « emboîté » autour de toute la fonction.';
      if (op === 'kf' && T.src.t === 'q') return 'On divise par un <b>nombre</b> : c’est un nombre × une fonction (diviser par 2, c’est multiplier par ½).';
      return 'Ce n’est pas la formule à appliquer en premier. Regarde comment sont reliés les <b>grands morceaux</b> de la fonction : par + ou −, par ×, par une barre de fraction, par une puissance, par une racine ? (💡 L’indice les encadre.)';
    }
    function pistePieces(ph) {
      const op = st.opDe[ph.T.id] || ph.T.d.op;
      if (op === 'quotient') return '<i>f</i> est en haut (le numérateur), <i>g</i> en bas (le dénominateur).';
      return '<i>u</i> est ce qui est « à l’intérieur » : dans la parenthèse, sous la racine ou au dénominateur.';
    }
    function hint() {
      const ph = phase();
      if (ph.type === 'op') {
        dessiner({ indice: true });
        const n = ph.T.kids.length;
        if (!n) return 'Cette fonction est simple : regarde le formulaire, lignes « formules de base » et « opérations ».';
        return `Voici ${n > 1 ? 'les grands morceaux' : 'le grand morceau'} de la fonction (encadré${n > 1 ? 's' : ''}). Comment ${n > 1 ? 'sont-ils reliés' : 'est-il « emballé »'} : par + ou −, par ×, par une barre de fraction, par une puissance, par une racine ?`;
      }
      return pistePieces(ph);
    }

    /* ---------- correction pas à pas ---------- */
    function solve() {
      const steps = [];
      q.phases.forEach((ph, j) => {
        const T = ph.T, qui = T.parent ? `Le morceau ${T.role === 'terme' ? '' : '<b>' + T.role + '</b> '}${E.math(T.node)}` : 'La fonction';
        if (ph.type === 'op') {
          const op = T.d.op, F0 = FORMULES[op];
          steps.push({
            say: `${qui} est ${article(op)}. ${raison(T)}`,
            run: async () => {
              st.choix = op; dessinerReponse();
              await wait(500);
              valideOp(ph, op); finPhase(j);
              await wait(700);
            }
          });
        } else {
          const roles = rolesDe(ph);
          steps.push({
            say: T.kids.map((k, i) => `<span class="qui r-${roles[i]}">${roles[i]}</span> = ${E.math(k.node)}`).join(' ; ') + '.',
            run: async () => {
              for (let i = 0; i < T.kids.length; i++) { st.lab[T.kids[i].id] = roles[i]; dessiner(); await wait(450); }
              T.kids.forEach(k => { st.tagRole[k.id] = st.lab[k.id]; });
              finPhase(j);
            }
          });
        }
      });
      return { reset() { reset(); return {}; }, steps };
    }
    function finPhase(j) {
      st.choix = null; st.sel = null;
      if (j < q.phases.length - 1) st.i = j + 1; else st.fini = true;
      dessiner();
    }
    function raison(T) {
      return {
        somme: 'On dérive terme par terme.',
        kf: 'Le nombre reste devant.',
        produit: 'Deux morceaux sont multipliés.',
        quotient: 'Il y a une grande barre de fraction.',
        puissance: 'Une expression entière est élevée à une puissance.',
        inverse: 'Un nombre est divisé par une expression.',
        racine: 'Une expression entière est sous la racine.',
        base: 'C’est une ligne du formulaire.', cst: ''
      }[T.d.op];
    }

    return {
      zone, charger, dessiner, phase: () => phase(), estFini: () => !!(st && st.fini), source: () => q && q.src,
      check, hint, solve,
      edited() {},
      debug: () => ({ q, st })
    };
  }


/* =====================================================================
   Onglet 2 : « Remplir la formule » : choisir la dérivée des morceaux simples,
   glisser les tuiles f, g, f′, g′ (ou u, u′) dans les cases de la formule,
   puis faire défiler les lignes de simplification jusqu'à la forme finale.
   ===================================================================== */
// phrase de la correction pour chaque étape de la simplification
const DIRE_LIGNE = {
  distribuer: 'On distribue : chaque terme du premier facteur multiplie chaque terme du second (suis les arcs).',
  'calculer les produits': 'On calcule chaque produit, en faisant attention aux signes.',
  'enlever les parenthèses': 'On enlève les parenthèses : le « − » devant change le signe de chaque terme.',
  'réduire': 'On réduit : on regroupe les termes de même degré.'
};
const NOM_TUILE = { f: 'f', g: 'g', u: 'u', fp: 'f′', gp: 'g′', up: 'u′' };
const COUL_TUILE = { f: 'f', g: 'g', u: 'u', fp: 'f', gp: 'g', up: 'u' };

// Plan d'un morceau : sa formule à cases, ses tuiles, ce qu'il faut choisir avant.
// comp : composées permises (banque B) ; renvoie { T, op, tmpl, trous: Map id → attendu, tuiles, choix, sous, deriv }
function planDe(T, comp) {
  const p = { T, op: T.d.op, trous: new Map(), tuiles: [], choix: [], sous: [], deriv: E.D(T.src, { composees: comp }) };
  const trou = (id, cls) => E.H(id, cls);
  // dérivée d'un morceau : choisie (morceau simple) ou trouvée par sa propre formule (morceau emboîté)
  const derivee = (kid, id, etiquette) => {
    if (aDecouper(kid)) p.sous.push({ plan: planDe(kid, comp), id });
    else p.choix.push({ id, etiquette, morceau: kid.src, props: propositions(kid.src, comp) });
  };
  const k = T.kids;
  switch (p.op) {
    case 'produit':
      derivee(k[0], 'fp', 'f′'); derivee(k[1], 'gp', 'g′');
      p.tmpl = E.S(E.Pd(trou('fp'), trou('g')), E.Pd(trou('f'), trou('gp')));
      p.tuiles = [['f', k[0].src], ['g', k[1].src]];
      break;
    case 'quotient':
      derivee(k[0], 'fp', 'f′'); derivee(k[1], 'gp', 'g′');
      p.tmpl = E.Q(E.S(E.Pd(trou('fp'), trou('g')), E.G(E.Pd(trou('f'), trou('gp')))), E.W(trou('g'), 2));
      p.tuiles = [['f', k[0].src], ['g', k[1].src]];
      break;
    case 'puissance': case 'inverse': {
      derivee(k[0], 'up', 'u′');
      const n = p.op === 'inverse' ? -1 : T.d.n;

        + ordre.map(id => `<button class="tuile r-${COUL_TUILE[id]}${st.sel === id ? ' on' : ''}" data-t="${id}"><span class="nom">${NOM_TUILE[id]}</span><span class="m">${E.html(valeurTuile(p, id))}</span></button>`).join('')
        + '</div><p class="qhint">Une tuile peut servir deux fois (<i>g</i> et <i>g</i><sup>2</sup>). Clique sur une case remplie pour la vider.</p>';
      ctx.q.querySelectorAll('.tuile').forEach(b => {
        const id = b.dataset.t;
        glisserVers(b, `<span class="tuile r-${COUL_TUILE[id]}"><span class="nom">${NOM_TUILE[id]}</span></span>`, '.modele .trou',
          c => poserTuile(c, id), () => { st.sel = st.sel === id ? null : id; dessiner(); });
      });
    }
    function clicCase(el) {
      const ph = phase();
      if (st.fini || !ph || ph.type !== 'placer' || App.sol) return;
      const i = +el.dataset.h.split(':')[1];
      if (st.sel) poserTuile(el, st.sel);
      else { delete st.cases[cle(ph.p, casesDe(ph.p.tmpl)[i], i)]; st.faux.delete(i); ctx.changed(); dessiner(); }
    }
    function poserTuile(el, id) {
      const ph = phase(); if (st.fini || !ph || ph.type !== 'placer') return;
      const i = +el.dataset.h.split(':')[1];
      st.cases[cle(ph.p, casesDe(ph.p.tmpl)[i], i)] = id;
      st.faux.delete(i); st.sel = null;
      ctx.changed(); dessiner();
    }

    /* ---------- vérification ---------- */
    // la formule est remplie : le Bravo vient quand la simplification est arrivée à la forme finale
    function fin(msg) {
      if (st.ligne >= q.lignes.length) return { ok: true, msg: (msg ? msg + ' ' : '') + 'Compare avec ta feuille.' };
      feedback('ok', 'Oui ! ✓', (msg ? msg + ' ' : '') + 'Fais maintenant défiler la simplification, ligne par ligne, jusqu’à la forme finale.');
      return null;
    }
    function check() {
      if (st.fini) return fin('');
      const ph = phase(), p = ph.p;
      let msg;
      if (ph.type === 'choix') {
        if (p.choix.some(c => st.choix[c.id] === undefined)) return { ok: false, empty: true, msg: 'Choisis une dérivée sur chaque ligne.' };
        const faux = p.choix.filter(c => c.props[st.choix[c.id]].faute);
        if (faux.length) { faux.forEach(c => st.fauxChoix.add(c.id)); dessinerReponse(); return { ok: false, msg: PISTES_FAUTES[faux[0].props[st.choix[faux[0].id]].faute] }; }
        p.choix.forEach(c => { st.valeur[p.T.id + ':' + c.id] = c.props.find(o => !o.faute).node; });
        msg = p.auto ? 'Les dérivées sont justes.' : 'Les dérivées sont justes. Glisse maintenant les tuiles dans les cases.';
      } else {
        const cs = casesDe(p.tmpl);
        if (cs.some((h, i) => !st.cases[cle(p, h, i)])) return { ok: false, empty: true, msg: 'Remplis toutes les cases de la formule.' };
        if (!memeValeur(remplie(p, false), p.deriv)) {
          cs.forEach((h, i) => { if (st.cases[cle(p, h, i)] !== h.id) st.faux.add(i); });
          dessiner();
          return { ok: false, msg: pistePlacer(p) };
        }
        msg = 'La formule est bien remplie.';
      }
      const emboite = p !== q.plan && (ph.type === 'placer' || p.auto);
      avancer();
      dessiner();
      if (st.fini) return fin(msg);
      feedback('ok', 'Oui ! ✓', msg + (emboite ? ' Cette dérivée devient une tuile de la formule suivante.' : ''));
      return null;
    }
    function pistePlacer(p) {
      const cs = casesDe(p.tmpl), mis = cs.map((h, i) => st.cases[cle(p, h, i)]);
      if (p.op === 'produit') return 'Chaque terme du produit contient <b>une seule</b> dérivée : <i>f</i>′·<i>g</i> + <i>f</i>·<i>g</i>′.';
      if (p.op === 'quotient') {
        if (mis[cs.length - 1] !== 'g') return 'En bas, c’est <i>g</i><sup>2</sup> : le dénominateur, au carré.';
        return 'Dans le quotient, l’ordre compte : on commence par <i>f</i>′·<i>g</i> (la dérivée du haut), puis on soustrait <i>f</i>·<i>g</i>′.';
      }
      if (p.op === 'racine') return '<i>u</i>′ va en haut, et <i>u</i> reste sous la racine.';
      return 'Dans la puissance, on garde <i>u</i> ; puis on multiplie par la dérivée <i>u</i>′.';
    }
    function hint() {
      const ph = phase();
      if (!ph || st.fini) return null;
      if (ph.type === 'choix') return 'Rappelle-toi : (<i>x</i><sup><i>n</i></sup>)′ = <i>n</i>·<i>x</i><sup><i>n</i>−1</sup>, (1/<i>x</i>)′ = −1/<i>x</i><sup>2</sup>, (√<i>x</i>)′ = 1/(2√<i>x</i>), et la dérivée d’une constante est 0.';
      const F0 = FORMULES[ph.p.op];
      return `Compare case par case avec la formule <span class="m">(${F0.f})′ = ${F0.d}</span> : chaque case attend la tuile qui porte le même nom.`;
    }

    /* ---------- correction pas à pas ---------- */
    function solve() {
      const steps = [];
      q.phases.forEach(ph => {
        const p = ph.p;
        if (ph.type === 'auto') return;
        if (ph.type === 'choix') {
          steps.push({
            say: (p.choix.length > 1 ? 'Les dérivées : ' : 'La dérivée : ') + p.choix.map(c => `<span class="m">${c.etiquette.length < 4 ? `<span class="qui r-${c.id[0]}">${c.etiquette}</span> = (${E.html(c.morceau)})′` : c.etiquette} = ${E.html(c.props.find(o => !o.faute).node)}</span>`).join(' ; ') + '.',
            run: async () => {
              for (const c of p.choix) { st.choix[c.id] = c.props.findIndex(o => !o.faute); dessinerReponse(); await wait(350); }
              p.choix.forEach(c => { st.valeur[p.T.id + ':' + c.id] = c.props.find(o => !o.faute).node; });
              await wait(300);
              avancer(); dessiner();
            }
          });
        } else {
          const sd = p === q.plan ? null : sousDe(p), nom = sd && (sd.s.id[0] === 't' ? 'ce terme' : `<span class="qui r-${sd.s.id[0]}">${sd.s.id[0]}</span>`);
          steps.push({
            say: sd ? `On remplit la formule pour ${nom} : chaque tuile va dans la case qui porte son nom. Sa dérivée servira ensuite dans la grande formule.`
              : 'On remplit la formule : chaque tuile va dans la case qui porte son nom.',
            run: async () => {
              const cs = casesDe(p.tmpl);
              for (let i = 0; i < cs.length; i++) { st.cases[cle(p, cs[i], i)] = cs[i].id; dessiner(); await wait(300); }
              avancer(); dessiner();
            }
          });
        }
      });
      // somme : les dérivées choisies s'assemblent d'elles-mêmes (pas de case à remplir)
      if (q.plan.auto) steps.push({
        say: 'On met les dérivées des termes bout à bout : c’est <i>f</i>′(<i>x</i>).',
        run: async () => { dessiner(); }
      });
      // puis la simplification, ligne par ligne, jusqu'à la forme finale
      q.lignes.forEach((l, i) => steps.push({
        say: DIRE_LIGNE[l.lab] ? DIRE_LIGNE[l.lab] + (i === q.lignes.length - 1 ? ' Voilà la forme finale.' : '')
          : i === q.lignes.length - 1 ? 'Voilà la forme finale.' : i ? 'On continue de simplifier.' : 'On simplifie, ligne par ligne.',
        run: async () => { st.ligne = i + 1; dessinerLignes(); }
      }));
      return { reset() { reset(); return {}; }, steps };
    }


    return {
      zone, charger, dessiner, estFini: () => !!(st && st.fini), source: () => q && q.src,
      check, hint, solve,
      edited() { if (st && (st.faux.size || st.fauxChoix.size)) { st.faux.clear(); st.fauxChoix.clear(); dessiner(); } },
      debug: () => ({ q, st })
    };
  }


'use strict';
/* =====================================================================
   Les quatre onglets : le même déroulé en quatre étapes.
     1. reconnaître la formule et les morceaux f, g, u        (creerFormule)
     2. choisir la dérivée de chaque morceau parmi trois       (creerRemplir)
     3. remplir la formule                                     (creerRemplir)
     4. faire défiler la simplification jusqu'à la forme finale (creerRemplir)
   cfg : genre (clé de GENS), comp (composées permises), formule (options de l'étape 1),
         cours (onglet « Exercices du cours » : les fonctions des banques, dans l'ordre)
   ===================================================================== */
function creerOnglet(cfg) {
  return function (ctx) {
    const niv = ctx.level;
    const formuleDonnee = !!(cfg.formule && cfg.formule.sansOp);
    ctx.tools.innerHTML = '<ol class="etapes" aria-label="Les quatre étapes">' + [formuleDonnee ? 'Morceaux' : 'Formule', 'Dérivées', 'Remplir', 'Simplifier']
      .map((n, i) => '<li><b><span>' + (i + 1) + '</span></b>' + n + '</li>').join('') + '</ol>';
    const cours = cfg.cours ? exercicesCours(ctx, niv, (s, c) => charger(s, c)) : null;
    const s1 = creerFormule(ctx, cfg.formule || {});
    const s2 = creerRemplir(ctx);
    ctx.termine = () => doCheck();            // la simplification est arrivée à la forme finale
    let etape = 1, src = null, comp = cfg.comp;

    // indicateur des quatre étapes : formule, dérivées, remplir, simplifier
    function majEtapes() {
      let cur = 1;
      if (etape === 2) { const { q, st } = s2.debug(); cur = st.fini ? 4 : q.phases[st.i].type === 'choix' ? 2 : 3; }
      ctx.tools.querySelectorAll('.etapes li').forEach((li, i) => {
        li.classList.toggle('on', i + 1 === cur);
        li.classList.toggle('fait', i + 1 < cur);
      });
    }
    const montrer = (n, dessine = true) => {
      etape = n;
      s1.zone.style.display = n === 1 ? '' : 'none';
      s2.zone.style.display = n === 2 ? '' : 'none';
      if (dessine) (n === 1 ? s1 : s2).dessiner();
      majEtapes();
    };
    function charger(s, c) {
      src = s; comp = c;
      cancelAnim();
      montrer(1, false);
      s1.charger(src, comp);
      majEtapes();
      if (s1.estFini()) passer('');           // rien à reconnaître : on passe directement aux dérivées
    }
    // étape 1 réussie : on passe aux dérivées
    function passer(msg) {
      s2.charger(src, comp);
      montrer(2, false);
      if (msg !== '') feedback('ok', 'Oui ! ✓', msg + ' Passons aux dérivées : choisis celle de chaque morceau.');
    }

    return {
      next() { if (cours) cours.suivant(); else charger(genFonction(cfg.genre, niv), cfg.comp); },
      check() {
        try {
          if (etape === 2) { const r = s2.check(); if (cours && r && r.ok && !App.revealed) cours.reussi(); return r; }
          const r = s1.check();
          if (r && r.ok) { passer(r.msg || ''); return null; }
          return r;
        } finally { majEtapes(); }
      },
      hint() { return (etape === 1 ? s1 : s2).hint(); },
      edited() { (etape === 1 ? s1 : s2).edited(); },
      // correction : les quatre étapes à la suite
      solve() {
        const a = s1.solve();
        s2.charger(src, comp, true);                  // reconstruit l'étape 2 sans toucher au reste
        const b = s2.solve();
        const vers = (n, st) => Object.assign({}, st, { run: async S => { if (etape !== n) montrer(n); return st.run(S); } });
        return {
          reset() { b.reset(); a.reset(); montrer(1); return {}; },
          steps: [...a.steps.map(st => vers(1, st)), ...b.steps.map(st => vers(2, st))]
        };
      },
      charger,
      debug: () => ({ etape, src, s1: s1.debug(), s2: s2.debug() })
    };
  };
}

/* ---------- onglet « Exercices du cours » ----------
   Niveau 1 : banque A, niveau 1 ; niveaux 2 et 3 : banques A puis B du même niveau (la banque B n'a pas de niveau 1).
   Une rangée de numéros au-dessus de la fonction : l'élève choisit l'exercice de son cahier. */
function exercicesCours(ctx, niv, charger) {
  const liste = [];
  for (const b of ['A', 'B']) (BANQUES[b][niv - 1] || []).forEach((s, j) => liste.push({ b, n: j + 1, s, cle: b + niv + '-' + (j + 1) }));
  const cleI = App.key + '.cours' + niv, cleF = App.key + '.coursFaits';
  let i = Math.max(0, Math.min(+storeGet(cleI, 0) || 0, liste.length - 1)), premier = true;
  const faits = new Set(storeGet(cleF, []));
  const barre = document.createElement('div');
  barre.className = 'ex-cours';
  barre.setAttribute('role', 'group');
  barre.setAttribute('aria-label', 'Exercices du cours');
  ctx.tools.prepend(barre);
  function dessiner() {
    barre.innerHTML = ['A', 'B'].filter(b => liste.some(e => e.b === b)).map(b =>
      `<span class="grp" title="Banque ${b}, p. ${b === 'A' ? (niv < 3 ? 11 : 12) : 17}">${b}${niv}</span>`
      + liste.map((e, k) => e.b !== b ? '' : `<button class="num${k === i ? ' on' : ''}${faits.has(e.cle) ? ' fait' : ''}" data-k="${k}" title="Banque ${e.b}, niveau ${niv}, n° ${e.n}" aria-label="Exercice ${e.b}${niv} n° ${e.n}">${e.n}</button>`).join('')).join('<span class="sep"></span>');
    barre.querySelectorAll('.num').forEach(bt => bt.onclick = () => { i = +bt.dataset.k; ouvrir(); setState(); });
  }
  function ouvrir() { storeSet(cleI, i); dessiner(); charger(liste[i].s, liste[i].b === 'B'); }
  return {
    // « Autre question » : l'exercice suivant de la liste (au premier affichage : le dernier ouvert)
    suivant() { if (!premier) i = (i + 1) % liste.length; premier = false; ouvrir(); },
    reussi() { faits.add(liste[i].cle); storeSet(cleF, [...faits]); dessiner(); }
  };
}
